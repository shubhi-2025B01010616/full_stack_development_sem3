<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKS Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>BOOKS Table</h1>

    <form id="bookForm">

        <table>

            <tr>
                <th>Product Code</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Purchase</th>
                <th>Quantity</th>
            </tr>

            <tr>
                <td>001</td>
                <td>Biography Of Pt. Jawaharlal Nehru</td>
                <td>200</td>
                <td><input type="checkbox"></td>
                <td><input type="number" min="0" value="0"></td>
            </tr>

            <tr>
                <td>002</td>
                <td>Harry Potter</td>
                <td>400</td>
                <td><input type="checkbox"></td>
                <td><input type="number" min="0" value="0"></td>
            </tr>

            <tr>
                <td>003</td>
                <td>Discovery Of India</td>
                <td>550</td>
                <td><input type="checkbox"></td>
                <td><input type="number" min="0" value="0"></td>
            </tr>

            <tr>
                <td>004</td>
                <td>Agni Ki Udaan</td>
                <td>250</td>
                <td><input type="checkbox"></td>
                <td><input type="number" min="0" value="0"></td>
            </tr>

            <tr>
                <td>005</td>
                <td>Anamika Bachchan</td>
                <td>600</td>
                <td><input type="checkbox"></td>
                <td><input type="number" min="0" value="0"></td>
            </tr>

        </table>

        <div class="buttons">
            <button type="button" id="billBtn">Show My Bill</button>
            <button type="reset">RESET</button>
        </div>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
